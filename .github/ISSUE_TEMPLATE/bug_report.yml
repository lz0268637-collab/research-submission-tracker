name: 问题反馈
description: 报告安装、启动或功能异常
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传论文原稿、邮箱、密码或 API Key；截图前请遮盖敏感信息。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options: [Windows 11, Windows 10, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开软件开始，依次描述做了什么。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
